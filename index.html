<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TABAKBO 기타 탭 악보 편집기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="vendor/html2canvas.min.js"></script>
<!-- 안드로이드 앱(Capacitor) 빌드에서만 존재하는 파일. 웹(GitHub Pages)에서는 404로 무시되며
     window.TabakboNative 가 정의되지 않아 항상 브라우저 다운로드 방식으로 동작한다. -->
<script src="capacitor-bridge.js"></script>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --border: #e3e6ec;
    --text: #1c1f26;
    --muted: #6b7280;
    --primary: #4361ee;
    --primary-text: #ffffff;
    --danger: #e5484d;
    --line: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard", "맑은 고딕", sans-serif;
    margin: 0; padding: 18px; background: var(--bg); color: var(--text);
  }
  h1 { font-size: 17px; font-weight: 700; margin: 0 14px 0 2px; letter-spacing: -0.02em; white-space: nowrap; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .toolbar-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .toolbar-divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }
  .toolbar-spacer { flex: 1 1 auto; }

  button {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 9px; font-size: 12px; font-weight: 500; font-family: inherit;
    color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 9px; cursor: pointer; white-space: nowrap;
    transition: background-color .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover { background: #f7f8fa; border-color: #d3d7de; }
  button:active { transform: translateY(1px); }
  button:disabled { cursor: default; opacity: 0.5; }
  button.icon-only { padding: 6px; }
  button.active, #penBtn.active {
    background: var(--primary); border-color: var(--primary); color: var(--primary-text);
  }
  button.active:hover, #penBtn.active:hover { background: #3651d4; }
  button.danger-hover:hover { background: #fdeceb; border-color: #f6c6c4; color: var(--danger); }

  .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 화면에는 노출하지 않지만, JS에서 계속 bpmInput을 읽고 쓰므로 요소 자체는 남겨둔다(기본값 90). */
  label.bpm-field { display: none; }
  input[type="number"] {
    width: 52px; padding: 5px 4px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 7px; text-align: center; background: white; color: var(--text);
  }
  input[type="number"]:focus, input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  #status { font-size: 12px; color: var(--muted); padding: 4px 2px; }
  #status.error { color: var(--danger); }
  #status.ok { color: #1a9e6e; }
  #help { font-size: 12px; color: var(--muted); margin: 2px 4px 12px; }

  /* 평소에는 화면 밖에 치워두고, 칸을 선택하면 그 칸 안으로 옮겨져 꽉 채운다(.cell #fretInput 규칙). */
  #fretInput {
    position: fixed; top: -9999px; left: -9999px;
    width: 76px; font-size: 16px; font-family: inherit; padding: 8px; text-align: center;
    border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--text);
  }
  .cell #fretInput {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; border-radius: 0; padding: 0; background: transparent;
    font-weight: bold; font-size: 15px; z-index: 2;
  }
  .cell #fretInput:focus { outline: none; background: rgba(74,125,252,0.15); }

  button, .cell { touch-action: manipulation; -webkit-touch-callout: none; }
  input, button { -webkit-tap-highlight-color: transparent; }

  @media (pointer: coarse) {
    .cell { width: 36px; height: 34px; min-width: 36px; font-size: 13px; }
    button { padding: 8px 10px; font-size: 12px; min-height: 40px; }
    button.icon-only { padding: 8px; min-width: 40px; justify-content: center; }
    .toolbar { gap: 8px; padding: 10px; }
    .toolbar-group { gap: 6px; }
    input[type="number"] { width: 56px; padding: 7px 4px; min-height: 36px; }
    .icon { width: 15px; height: 15px; }
    .cell .fret-label { font-size: 17px; }
    .cell #fretInput { font-size: 17px; }
  }

  @media (orientation: portrait) and (max-width: 700px) {
    .toolbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .toolbar > h1 { grid-column: 1 / -1; }
    .toolbar-group { display: contents; }
    .toolbar-divider, .toolbar-spacer { display: none; }
    .toolbar button {
      width: 100%; flex-direction: column; gap: 3px;
      padding: 6px 2px; font-size: 10.5px; white-space: normal; text-align: center;
    }
    .toolbar button .icon { width: 16px; height: 16px; }
    #status { grid-column: 1 / -1; }
  }

  #tabWrap { overflow-x: auto; overflow-y: visible; background: white; border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 18px 6px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  #tabInner { position: relative; display: inline-block; }
  #penCanvas { position: absolute; top: 0; left: 0; pointer-events: none; touch-action: none; }
  .tab-line-row { display: flex; align-items: stretch; margin-bottom: 26px; }
  table.tab-line { border-collapse: collapse; font-family: Consolas, monospace; }
  table.tab-line td { text-align: center; padding: 0; }

  .tab-clef {
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px;
    font-family: Georgia, "Times New Roman", serif; font-weight: bold; font-size: 19px;
    color: #222; border-left: 3px solid #333; border-right: 3px solid #333;
    padding: 0 10px; flex: none;
  }

  .cell {
    width: 30px; height: 26px; min-width: 30px;
    font-size: 12px; color: #111; cursor: pointer; user-select: none;
    position: relative;
    background-image: linear-gradient(#777, #777);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 2px;
  }
  .cell .fret-label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: white; padding: 0 3px; font-weight: bold; font-size: 15px; z-index: 2;
  }
  .cell:hover { background-image: linear-gradient(#4a7dfc, #4a7dfc); }
  .cell.selected { outline: 2px solid #4a7dfc; outline-offset: -2px; z-index: 3; }
  .cell.dragging-source { opacity: 0.35; }
  .cell.drag-target { outline: 2px dashed var(--primary); outline-offset: -2px; background-color: rgba(67,97,238,0.1); z-index: 3; }
  footer { margin-top: 14px; font-size: 12px; color: #999; }
  footer a { color: #777; }
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
  <symbol id="i-plus-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
  <symbol id="i-minus-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>

  <symbol id="i-clear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></symbol>
</svg>

<div class="toolbar">
  <h1>🎸 TABAKBO</h1>

  <div class="toolbar-group">
    <button id="newBtn"><svg class="icon"><use href="#i-new"/></svg>새로 만들기</button>
    <button id="openBtn"><svg class="icon"><use href="#i-open"/></svg>열기</button>
    <button id="saveBtn"><svg class="icon"><use href="#i-save"/></svg>저장</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button id="exportBtn"><svg class="icon"><use href="#i-text"/></svg>텍스트</button>
    <button id="exportImageBtn"><svg class="icon"><use href="#i-image"/></svg>이미지</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button id="addMeasureBtn"><svg class="icon"><use href="#i-plus-square"/></svg>마디 추가</button>
    <button id="removeMeasureBtn"><svg class="icon"><use href="#i-minus-square"/></svg>마디 삭제</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <label class="bpm-field">BPM <input type="number" id="bpmInput" value="90" min="20" max="300" /></label>
    <button id="playBtn"><svg class="icon"><use href="#i-play"/></svg>재생</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button id="penBtn"><svg class="icon"><use href="#i-pen"/></svg>펜</button>
    <button id="undoDrawingBtn" class="icon-only" title="되돌리기"><svg class="icon"><use href="#i-undo"/></svg></button>
    <button id="clearDrawingBtn" class="icon-only danger-hover" title="그림 전체 지우기"><svg class="icon"><use href="#i-trash"/></svg></button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button id="muteBtn"><svg class="icon"><use href="#i-mute"/></svg>뮤트</button>
    <button id="clearBtn" class="danger-hover"><svg class="icon"><use href="#i-clear"/></svg>지우기</button>
  </div>

  <div class="toolbar-spacer"></div>
  <span id="status"></span>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none" />
</div>

<div id="help">
  칸을 탭(클릭)해 선택하면 그 칸에 바로 프렛 번호(0~24)를 입력할 수 있습니다. 데스크톱에서는 방향키로 칸 이동도 가능합니다.
</div>

<div id="tabWrap">
  <div id="tabInner">
    <div id="gridContent"></div>
    <canvas id="penCanvas"></canvas>
  </div>
</div>
<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="fretInput" />

<footer>모든 데이터는 브라우저 안에서만 처리되며 서버로 전송되지 않습니다. 저장/열기는 파일 다운로드·업로드로 동작합니다.</footer>

<script>
  // ---- 데이터 모델 ----
  const STRING_NAMES = ["e", "B", "G", "D", "A", "E"]; // 위(가는줄) -> 아래(굵은줄)
  const TUNING_MIDI = [64, 59, 55, 50, 45, 40];         // 각 줄의 개방현 MIDI (표준 튜닝)
  const SLOTS_PER_MEASURE = 16;                          // 4/4, 16분음표 그리드
  const MEASURES_PER_LINE = 4;                           // 한 줄에 표시할 마디 수

  function colsPerLine() {
    return MEASURES_PER_LINE * SLOTS_PER_MEASURE;
  }

  let tab = {
    bpm: 90,
    measures: 4,
    grid: [], // grid[stringIndex][col] = fret(int) | "x"(뮤트) | null
  };

  function totalCols() {
    return tab.measures * SLOTS_PER_MEASURE;
  }

  function makeEmptyGrid(measures) {
    const cols = measures * SLOTS_PER_MEASURE;
    return STRING_NAMES.map(() => new Array(cols).fill(null));
  }

  function resetTab() {
    tab = { bpm: 90, measures: 4, grid: makeEmptyGrid(4) };
    selected = { string: 0, col: 0 };
    strokes = [];
    document.getElementById("bpmInput").value = tab.bpm;
    renderGrid();
    redrawPenStrokes();
    syncFretInput();
  }

  // ---- 선택 상태 & 프렛 입력 ----
  let selected = { string: 0, col: 0 };

  function setFret(stringIdx, col, value) {
    tab.grid[stringIdx][col] = value;
    renderGrid();
  }

  function syncFretInput() {
    const val = tab.grid[selected.string][selected.col];
    const input = document.getElementById("fretInput");
    input.value = (val === null || val === undefined) ? "" : val;
  }

  function moveSelection(dString, dCol) {
    selected.string = Math.min(5, Math.max(0, selected.string + dString));
    selected.col = Math.min(totalCols() - 1, Math.max(0, selected.col + dCol));
    renderGrid();
    syncFretInput();
  }

  function selectCell(s, c) {
    selected = { string: s, col: c };
    renderGrid();
    syncFretInput();
    const input = document.getElementById("fretInput");
    input.focus();
    input.select();
  }

  // ---- 마우스로 이미 입력된 음표를 다른 칸으로 옮기기 ----
  // (터치는 화면 스크롤과 충돌하므로 기존처럼 탭=선택만 동작)
  let dragSource = null;
  let dragHighlightEl = null;

  function setDragHighlight(el) {
    if (dragHighlightEl === el) return;
    if (dragHighlightEl) dragHighlightEl.classList.remove("drag-target");
    dragHighlightEl = el;
    if (dragHighlightEl) dragHighlightEl.classList.add("drag-target");
  }

  function cellAtPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest(".cell") : null;
  }

  document.getElementById("fretInput").addEventListener("input", (e) => {
    let v = e.target.value.replace(/[^0-9]/g, "").slice(0, 2);
    if (v !== "" && parseInt(v, 10) > 24) v = "24";
    e.target.value = v;
    // 타이핑 도중에는 renderGrid()를 호출하지 않는다: 선택된 칸은 이 입력창이
    // 그대로 값을 보여주므로 재렌더링이 필요 없고, 매 글자마다 그리드를 다시
    // 그리며 입력창을 DOM에서 뗐다 붙이면 모바일 키보드가 깜빡여 두 번째
    // 숫자 입력이 씹히는 문제가 있었다.
    tab.grid[selected.string][selected.col] = v === "" ? null : parseInt(v, 10);
  });

  document.getElementById("muteBtn").addEventListener("click", () => {
    setFret(selected.string, selected.col, "x");
    document.getElementById("fretInput").value = "x";
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    setFret(selected.string, selected.col, null);
    document.getElementById("fretInput").value = "";
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.id === "bpmInput") return;
    if (e.key === "ArrowLeft") { moveSelection(0, -1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { moveSelection(0, 1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { moveSelection(-1, 0); e.preventDefault(); }
    else if (e.key === "ArrowDown") { moveSelection(1, 0); e.preventDefault(); }
  });

  // ---- 렌더링 (한 줄 = MEASURES_PER_LINE 마디씩 끊어서 여러 줄로 표시) ----
  function renderGrid() {
    const wrap = document.getElementById("gridContent");
    // fretInput은 선택된 칸 안으로 옮겨 붙이는 공용 엘리먼트라, gridContent를 통째로
    // 비우기 전에 먼저 꺼내둬야 포커스/값이 날아가지 않는다.
    document.body.appendChild(document.getElementById("fretInput"));
    wrap.innerHTML = "";

    const cpl = colsPerLine();
    const cols = totalCols();
    const totalLines = Math.ceil(cols / cpl);

    for (let lineIdx = 0; lineIdx < totalLines; lineIdx++) {
      const startCol = lineIdx * cpl;
      const endCol = Math.min(startCol + cpl, cols);

      const lineRow = document.createElement("div");
      lineRow.className = "tab-line-row";

      const clef = document.createElement("div");
      clef.className = "tab-clef";
      clef.innerHTML = "<div>T</div><div>A</div><div>B</div>";
      lineRow.appendChild(clef);

      const table = document.createElement("table");
      table.className = "tab-line";

      for (let s = 0; s < 6; s++) {
        const tr = document.createElement("tr");

        for (let c = startCol; c < endCol; c++) {
          const td = document.createElement("td");
          td.className = "cell";
          td.dataset.string = s;
          td.dataset.col = c;
          const isSelected = selected.string === s && selected.col === c;
          const val = tab.grid[s][c];

          if (isSelected) {
            td.classList.add("selected");
            td.appendChild(document.getElementById("fretInput"));
          } else if (val !== null && val !== undefined) {
            const label = document.createElement("div");
            label.className = "fret-label";
            label.textContent = val;
            td.appendChild(label);
          }

          td.addEventListener("pointerdown", (e) => {
            dragSource = { string: s, col: c, value: tab.grid[s][c], pointerType: e.pointerType };
            td.setPointerCapture(e.pointerId);
            if (e.pointerType === "mouse" && dragSource.value !== null && dragSource.value !== undefined) {
              td.classList.add("dragging-source");
            }
          });

          td.addEventListener("pointermove", (e) => {
            if (!dragSource || dragSource.pointerType !== "mouse") return;
            setDragHighlight(cellAtPoint(e.clientX, e.clientY));
          });

          td.addEventListener("pointerup", (e) => {
            if (!dragSource) return;
            setDragHighlight(null);
            td.classList.remove("dragging-source");

            let finalString = dragSource.string;
            let finalCol = dragSource.col;

            if (dragSource.pointerType === "mouse") {
              const targetTd = cellAtPoint(e.clientX, e.clientY);
              if (targetTd) {
                const ts = parseInt(targetTd.dataset.string, 10);
                const tc = parseInt(targetTd.dataset.col, 10);
                const moved = ts !== dragSource.string || tc !== dragSource.col;
                if (moved && dragSource.value !== null && dragSource.value !== undefined) {
                  tab.grid[dragSource.string][dragSource.col] = null;
                  tab.grid[ts][tc] = dragSource.value;
                }
                finalString = ts;
                finalCol = tc;
              }
            }

            dragSource = null;
            selectCell(finalString, finalCol);
          });

          td.addEventListener("pointercancel", () => {
            setDragHighlight(null);
            td.classList.remove("dragging-source");
            dragSource = null;
          });

          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      lineRow.appendChild(table);
      wrap.appendChild(lineRow);
    }

    applyResponsiveCellWidth();
    resizePenCanvas();
  }

  // ---- 셀 너비를 창 폭에 맞춰 축소 (데스크톱에서 가로 스크롤 방지, 터치 화면은 원래 크기 유지) ----
  const CLEF_COLUMN_WIDTH = 64; // .tab-clef 칸의 대략적인 렌더링 너비(여유 포함, 넉넉히 잡아 스크롤 방지)

  function applyResponsiveCellWidth() {
    if (window.matchMedia("(pointer: coarse)").matches) return;

    const wrap = document.getElementById("tabWrap");
    if (!wrap.querySelector(".tab-clef")) return;

    const wrapStyle = getComputedStyle(wrap);
    const wrapPadding = parseFloat(wrapStyle.paddingLeft) + parseFloat(wrapStyle.paddingRight);
    const available = wrap.clientWidth - wrapPadding - CLEF_COLUMN_WIDTH;

    let w = Math.floor(available / colsPerLine());
    w = Math.max(10, Math.min(30, w));

    document.querySelectorAll("#tabWrap .cell").forEach((td) => {
      td.style.width = w + "px";
      td.style.minWidth = w + "px";
    });
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      applyResponsiveCellWidth();
      resizePenCanvas();
    }, 150);
  });

  // ---- 펜 기능 (그리드 위에 겹쳐진 캔버스에 자유롭게 그리기) ----
  // 점은 {xFrac, y}로 저장: x는 캔버스 폭이 바뀌어도(반응형 셀 크기) 비율을 유지하고,
  // y는 절대값으로 유지해 마디 추가로 캔버스가 세로로 늘어나도 기존 그림 위치가 흔들리지 않는다.
  let penMode = false;
  let strokes = [];
  let currentStroke = null;
  let isDrawing = false;

  function getPenCanvas() {
    return document.getElementById("penCanvas");
  }

  function redrawPenStrokes() {
    const canvas = getPenCanvas();
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#111111";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    strokes.forEach((stroke) => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      const p0 = stroke[0];
      ctx.moveTo(p0.xFrac * canvas.width, p0.y);
      for (let i = 1; i < stroke.length; i++) {
        const p = stroke[i];
        ctx.lineTo(p.xFrac * canvas.width, p.y);
      }
      ctx.stroke();
    });
  }

  function resizePenCanvas() {
    const gridContent = document.getElementById("gridContent");
    const canvas = getPenCanvas();
    const w = gridContent.offsetWidth;
    const h = gridContent.offsetHeight;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      redrawPenStrokes();
    }
  }

  function pointFromEvent(e) {
    const canvas = getPenCanvas();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    return { xFrac: x / canvas.width, y };
  }

  function setPenMode(on) {
    penMode = on;
    const canvas = getPenCanvas();
    canvas.style.pointerEvents = penMode ? "auto" : "none";
    document.getElementById("penBtn").classList.toggle("active", penMode);
  }

  document.getElementById("penBtn").addEventListener("click", () => setPenMode(!penMode));

  document.getElementById("undoDrawingBtn").addEventListener("click", () => {
    strokes.pop();
    redrawPenStrokes();
  });

  document.getElementById("clearDrawingBtn").addEventListener("click", () => {
    strokes = [];
    redrawPenStrokes();
  });

  const penCanvasEl = getPenCanvas();
  penCanvasEl.addEventListener("pointerdown", (e) => {
    if (!penMode) return;
    isDrawing = true;
    currentStroke = [pointFromEvent(e)];
    strokes.push(currentStroke);
    penCanvasEl.setPointerCapture(e.pointerId);
  });
  penCanvasEl.addEventListener("pointermove", (e) => {
    if (!penMode || !isDrawing) return;
    currentStroke.push(pointFromEvent(e));
    redrawPenStrokes();
  });
  penCanvasEl.addEventListener("pointerup", () => { isDrawing = false; currentStroke = null; });
  penCanvasEl.addEventListener("pointercancel", () => { isDrawing = false; currentStroke = null; });

  // ---- 마디 추가/삭제 (한 줄 = MEASURES_PER_LINE 마디 단위) ----
  document.getElementById("addMeasureBtn").addEventListener("click", () => {
    tab.measures += MEASURES_PER_LINE;
    for (let s = 0; s < 6; s++) {
      for (let i = 0; i < colsPerLine(); i++) tab.grid[s].push(null);
    }
    renderGrid();
  });

  document.getElementById("removeMeasureBtn").addEventListener("click", () => {
    if (tab.measures <= MEASURES_PER_LINE) return; // 최소 한 줄은 유지
    const cpl = colsPerLine();
    const lineIdx = Math.floor(selected.col / cpl);
    const startCol = lineIdx * cpl;
    for (let s = 0; s < 6; s++) tab.grid[s].splice(startCol, cpl);
    tab.measures -= MEASURES_PER_LINE;
    selected.col = Math.min(startCol, totalCols() - 1);
    renderGrid();
    syncFretInput();
  });

  // ---- 상태 표시 ----
  function setStatus(text, cls) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = cls || "";
  }

  // ---- 브라우저 다운로드 헬퍼 ----
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function downloadDataUrl(dataUrl, filename) {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ---- 안드로이드 앱(Capacitor)에서 실행 중인지 ----
  function isNativeApp() {
    try {
      return !!(window.TabakboNative && window.TabakboNative.isNative());
    } catch (e) {
      return false;
    }
  }

  // ---- 파일 저장 ----
  // 웹(브라우저)에서는 기존처럼 다운로드하고, 안드로이드 앱 안에서는 blob 다운로드가
  // 동작하지 않으므로 공용 문서 폴더(다른 앱에서도 보이는 저장소)에 바로 파일을 쓴다.
  async function saveFile(filename, content, mime, isBase64) {
    if (isNativeApp()) {
      const { Filesystem, Directory, Encoding } = window.TabakboNative;
      const writeOptions = { path: filename, data: content, directory: Directory.Documents };
      if (!isBase64) writeOptions.encoding = Encoding.UTF8;
      await Filesystem.writeFile(writeOptions);
      setStatus(filename + " 문서 폴더에 저장됨", "ok");
    } else {
      if (isBase64) {
        downloadDataUrl("data:" + mime + ";base64," + content, filename);
      } else {
        downloadBlob(content, filename, mime);
      }
      setStatus(filename + " 다운로드됨", "ok");
    }
  }

  // ---- 저장 파일 이름 ----
  let lastBaseName = "tab";

  function sanitizeFilename(name) {
    return name.replace(/[\\/:*?"<>|]/g, "_").trim();
  }

  // 확장자를 뺀 파일 이름을 물어보고, 다음 저장에도 같은 이름이 기본값으로 뜨도록 기억한다.
  // 취소를 누르면 null을 반환한다.
  function promptFilename(ext) {
    const input = window.prompt("파일 이름을 입력하세요", lastBaseName);
    if (input === null) return null;
    const base = sanitizeFilename(input) || "tab";
    lastBaseName = base;
    return base + "." + ext;
  }

  // ---- 새로 만들기 / 저장 / 열기 / 내보내기 ----
  document.getElementById("newBtn").addEventListener("click", () => {
    if (confirm("현재 작업 중인 탭을 지우고 새로 시작할까요?")) resetTab();
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    const filename = promptFilename("json");
    if (!filename) return;
    tab.bpm = parseInt(document.getElementById("bpmInput").value, 10) || 90;
    tab.drawing = strokes;
    try {
      await saveFile(filename, JSON.stringify(tab), "application/json", false);
    } catch (err) {
      setStatus("저장 실패: " + err, "error");
    }
  });

  document.getElementById("openBtn").addEventListener("click", () => {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        tab = JSON.parse(reader.result);
        selected = { string: 0, col: 0 };
        strokes = tab.drawing || [];
        document.getElementById("bpmInput").value = tab.bpm || 90;
        renderGrid();
        redrawPenStrokes();
        syncFretInput();
        lastBaseName = sanitizeFilename(file.name.replace(/\.json$/i, "")) || lastBaseName;
        setStatus(file.name + " 불러옴", "ok");
      } catch (err) {
        setStatus("파일을 읽을 수 없습니다: " + err, "error");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const filename = promptFilename("txt");
    if (!filename) return;
    try {
      await saveFile(filename, buildAsciiTab(), "text/plain", false);
    } catch (err) {
      setStatus("내보내기 실패: " + err, "error");
    }
  });

  function buildAsciiTab() {
    const cols = totalCols();
    const widths = [];
    for (let c = 0; c < cols; c++) {
      let w = 1;
      for (let s = 0; s < 6; s++) {
        const v = tab.grid[s][c];
        if (v !== null && v !== undefined) w = Math.max(w, String(v).length);
      }
      widths.push(w);
    }

    let lines = [];
    for (let s = 0; s < 6; s++) {
      let line = STRING_NAMES[s] + "|";
      for (let c = 0; c < cols; c++) {
        const v = tab.grid[s][c];
        const cell = (v === null || v === undefined) ? "-".repeat(widths[c]) : String(v).padEnd(widths[c], "-");
        line += cell + "-";
        if ((c + 1) % SLOTS_PER_MEASURE === 0) line += "|";
      }
      lines.push(line);
    }
    return lines.join("\n");
  }

  // ---- 이미지로 내보내기 ----
  // 좌표를 다시 계산해서 그리는 대신, 화면에 보이는 그리드+펜 그림을 그대로 캡처해서
  // 내보낸다. 이러면 작업 화면과 이미지가 항상 100% 똑같다.
  const EXPORT_TARGET_WIDTH = 1600; // 내보낼 이미지 기준 폭(px). 화면 그대로를 이 폭으로 확대/축소한다.
  const EXPORT_MARGIN = 50;

  async function buildExportCanvas() {
    const target = document.getElementById("tabInner");
    const selectedEls = Array.from(document.querySelectorAll("#gridContent .cell.selected"));
    selectedEls.forEach((el) => el.classList.remove("selected"));

    let captured;
    try {
      captured = await html2canvas(target, {
        backgroundColor: "#ffffff",
        scale: EXPORT_TARGET_WIDTH / target.offsetWidth,
      });
    } finally {
      selectedEls.forEach((el) => el.classList.add("selected"));
    }

    const margin = Math.round(EXPORT_MARGIN * (captured.width / EXPORT_TARGET_WIDTH));
    const canvas = document.createElement("canvas");
    canvas.width = captured.width + margin * 2;
    canvas.height = captured.height + margin * 2;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(captured, margin, margin);
    return canvas;
  }

  document.getElementById("exportImageBtn").addEventListener("click", async () => {
    const filename = promptFilename("png");
    if (!filename) return;
    try {
      const canvas = await buildExportCanvas();
      const dataUrl = canvas.toDataURL("image/png");
      await saveFile(filename, dataUrl.split(",")[1], "image/png", true);
    } catch (err) {
      setStatus("이미지 생성 실패: " + err, "error");
    }
  });

  // ---- 재생 ----
  let audioCtx = null;
  let isPlaying = false;
  let stopRequested = false;
  let scheduledOscillators = [];
  let playbackTimer = null;

  function midiToFreq(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function setPlayButtonState() {
    document.getElementById("playBtn").textContent = isPlaying ? "정지" : "재생";
  }

  function stopPlayback() {
    stopRequested = true;
    scheduledOscillators.forEach((osc) => { try { osc.stop(); } catch (e) {} });
    scheduledOscillators = [];
    if (playbackTimer) { clearTimeout(playbackTimer); playbackTimer = null; }
    isPlaying = false;
    setPlayButtonState();
  }

  function playTab() {
    if (isPlaying) { stopPlayback(); return; }

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    stopRequested = false;
    isPlaying = true;
    setPlayButtonState();

    const bpm = parseInt(document.getElementById("bpmInput").value, 10) || 90;
    const slotSec = (60 / bpm) * (4 / SLOTS_PER_MEASURE); // 16분음표 하나의 길이
    const cols = totalCols();
    const startAt = audioCtx.currentTime + 0.15;

    for (let c = 0; c < cols; c++) {
      const t = startAt + c * slotSec;
      for (let s = 0; s < 6; s++) {
        const v = tab.grid[s][c];
        if (v === null || v === undefined || v === "x") continue;
        const midi = TUNING_MIDI[s] + parseInt(v, 10);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = midiToFreq(midi);

        const peak = 0.25;
        const decay = 0.6; // 통기타 여운을 흉내낸 감쇠 시간
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(peak, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, t + decay);

        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + decay + 0.05);
        scheduledOscillators.push(osc);
      }
    }

    const totalMs = (cols * slotSec + 0.7) * 1000;
    playbackTimer = setTimeout(() => {
      if (!stopRequested) { isPlaying = false; setPlayButtonState(); }
      scheduledOscillators = [];
    }, totalMs);
  }

  document.getElementById("playBtn").addEventListener("click", playTab);

  // ---- 시작 ----
  resetTab();
</script>
</body>
</html>
